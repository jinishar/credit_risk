services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8501}:8501"
    env_file:
      - path: .env
        required: false
    environment:
      - APP_PORT=8501
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    restart: unless-stopped
